  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #060913; color: #F1F5F9; overflow-x: hidden; }
    h1, h2, h3, .font-display { font-family: 'Outfit', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .glass-input {
      background: rgba(11, 17, 32, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .glass-input:focus {
      border-color: #3B82F6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
    }

    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(11, 17, 32, 0.8); }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #3B82F6; }

    .animate-in { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Waveform Animation for Mock Interview */
    .waveform-bar {
      animation: wavePulse 1.2s ease-in-out infinite;
    }
    @keyframes wavePulse {
      0%, 100% { height: 6px; }
      50% { height: 26px; }
    }

    /* Hardware-Accelerated Glitch-Free Cursor System */
    @media (hover: hover) and (pointer: fine) {
      body, html {
        cursor: default;
      }
      body.custom-cursor-active a, 
      body.custom-cursor-active button, 
      body.custom-cursor-active [role="button"],
      body.custom-cursor-active [onclick],
      body.custom-cursor-active .cursor-pointer {
        cursor: pointer;
      }
    }

    #custom_cursor_dot {
      position: fixed;
      top: 0;
      left: 0;
      width: 8px;
      height: 8px;
      background: #38BDF8;
      border-radius: 50%;
      pointer-events: none !important;
      z-index: 999999;
      transform: translate3d(-100px, -100px, 0);
      opacity: 0;
      transition: opacity 0.2s ease, width 0.2s ease, height 0.2s ease, background 0.2s ease;
      will-change: transform;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
    }

    #custom_cursor_ring {
      position: fixed;
      top: 0;
      left: 0;
      width: 32px;
      height: 32px;
      border: 1.5px solid rgba(56, 189, 248, 0.5);
      background: rgba(56, 189, 248, 0.04);
      border-radius: 50%;
      pointer-events: none !important;
      z-index: 999998;
      transform: translate3d(-100px, -100px, 0);
      opacity: 0;
      transition: opacity 0.2s ease, width 0.25s cubic-bezier(0.16, 1, 0.3, 1), height 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease, background 0.2s ease;
      will-change: transform;
      backdrop-filter: blur(1px);
    }

    /* Cursor States */
    #custom_cursor_dot.cursor-hover {
      width: 10px;
      height: 10px;
      background: #60A5FA;
      box-shadow: 0 0 14px rgba(96, 165, 250, 0.9);
    }

    #custom_cursor_ring.cursor-hover {
      width: 48px;
      height: 48px;
      border-color: rgba(96, 165, 250, 0.9);
      background: rgba(59, 130, 246, 0.12);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.25);
    }

    #custom_cursor_dot.cursor-active {
      transform: translate3d(-100px, -100px, 0) scale(0.7);
      background: #A855F7;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.9);
    }

    #custom_cursor_ring.cursor-active {
      width: 24px;
      height: 24px;
      border-color: #A855F7;
      background: rgba(168, 85, 247, 0.2);
    }

    /* Smart text input focus: fade out cleanly to reveal native text cursor */
    #custom_cursor_dot.cursor-text-mode,
    #custom_cursor_ring.cursor-text-mode {
      opacity: 0 !important;
      transform: scale(0.3);
    }

    /* Scroll Reveal System */
    .reveal-scroll {
      opacity: 0;
      transform: translateY(32px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }
    .reveal-scroll.is-revealed {
      opacity: 1;
      transform: translateY(0);
    }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }
    .reveal-delay-4 { transition-delay: 0.4s; }

    /* Interactive Spotlight Background */
    .spotlight-container {
      position: relative;
      background: radial-gradient(850px circle at var(--mouse-x, 50%) var(--mouse-y, 25%), rgba(59, 130, 246, 0.08), transparent 50%);
    }

    /* Shimmer gradient animation */
    @keyframes shimmerFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .gradient-shimmer {
      background: linear-gradient(90deg, #60A5FA, #38BDF8, #A855F7, #EC4899, #60A5FA);
      background-size: 300% 300%;
      animation: shimmerFlow 6s ease infinite;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Floating subtle hover card 3D lift */
    .hover-lift-card {
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease, border-color 0.3s ease;
    }
    .hover-lift-card:hover {
      transform: translateY(-4px);
      border-color: rgba(59, 130, 246, 0.4);
      box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.7), 0 0 25px rgba(59, 130, 246, 0.2);
    }

    /* AST Live Scan Radar Line Animation */
    @keyframes radarScan {
      0% { top: 0%; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }
    .ast-radar-scan {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #38BDF8, #60A5FA, transparent);
      box-shadow: 0 0 15px #38BDF8;
      animation: radarScan 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* Floating Pill Badge Pulse */
    @keyframes floatingBadge {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .float-badge {
      animation: floatingBadge 3s ease-in-out infinite;
    }

    /* Audio Waveform Pulse for AI Interviewer */
    @keyframes wavePulse {
      0%, 100% { height: 6px; }
      50% { height: 26px; }
    }
    .wave-bar {
      animation: wavePulse 1.1s ease-in-out infinite;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.12s; }
    .wave-bar:nth-child(3) { animation-delay: 0.24s; }
    .wave-bar:nth-child(4) { animation-delay: 0.36s; }
    .wave-bar:nth-child(5) { animation-delay: 0.48s; }
    .wave-bar:nth-child(6) { animation-delay: 0.60s; }
    .wave-bar:nth-child(7) { animation-delay: 0.72s; }
    .wave-bar:nth-child(8) { animation-delay: 0.84s; }

    @media print {

        background: #ffffff !important;
        color: #0f172a !important;

      #app, main {

        padding: 0 !important;
        margin: 0 !important;
      }

        background: #ffffff !important;
        color: #0f172a !important;

        border: none !important;
        padding: 0 !important;
      }

        border-color: #cbd5e1 !important;
      }
      .resume-print-sheet a {
        text-decoration: underline !important;
        color: #0284c7 !important;
      }

</head>

import math

def softmax(vector):
    exp_v = [math.exp(x) for x in vector]
    total = sum(exp_v)
    return [round(x / total, 4) for x in exp_v]

def scaled_dot_product(query, keys, dim=4):
    scores = []
    for key in keys:
        dot = sum(q * k for q, k in zip(query, key))
        scores.append(dot / math.sqrt(dim))
    return softmax(scores)

#include <vector>
#include <queue>

using namespace std;

void bfsShortestPath(int startNode, int n, const vector<vector<int>>& adj) {
    vector<int> dist(n, -1);
    queue<int> q;

    dist[startNode] = 0;
    q.push(startNode);

    while (!q.empty()) {
        int u = q.front();
        q.pop();

        for (int v : adj[u]) {
            if (dist[v] == -1) {
                dist[v] = dist[u] + 1;
                q.push(v);
            }
        }
    }

    cout << "=== Shortest Distances from Root Node " << startNode << " ===\\n";
    for (int i = 0; i < n; ++i) {
        cout << "Node " << i << " -> Distance: " << dist[i] << " hops\\n";
    }
}

int main() {
    int n = 5;
    vector<vector<int>> adj(n);

    adj[1] = {0, 3};
    adj[2] = {0, 3, 4};
    adj[3] = {1, 2, 4};
    adj[4] = {2, 3};

    bfsShortestPath(0, n, adj);
    return 0;
}`

    // --- SOCIAL URL SANITIZER & LINK FORMATTER ---
    function formatExternalUrl(raw, fallbackDomain = '') {
      if (!raw || typeof raw !== 'string') return '#';
      let str = raw.trim();
      if (!str) return '#';
      // Strip accidental duplicate http/https prefixes
      str = str.replace(/^(https?:\/\/)+/i, '');
      str = str.replace(/\/+$/, '');
      if (fallbackDomain && !str.includes('.')) {
        return `https://${fallbackDomain}/${str.replace(/^@/, '')}`;
      }
      return `https://${str}`;
    }

    function getDisplayHandle(raw, fallback = 'user') {
      if (!raw || typeof raw !== 'string') return fallback;
      let str = raw.trim();
      if (!str) return fallback;
      // Strip http/https
      str = str.replace(/^(https?:\/\/)+/i, '');
      // Strip query parameters and anchors
      str = str.split('?')[0].split('#')[0];
      // Strip trailing slashes
      str = str.replace(/\/+$/, '');
      // Strip known platform domain prefixes
      str = str.replace(/^(www\.)?(linkedin\.com\/in\/|linkedin\.com\/|leetcode\.com\/u\/|leetcode\.com\/|hackerrank\.com\/profile\/|hackerrank\.com\/|github\.com\/|codeforces\.com\/profile\/|codeforces\.com\/|kaggle\.com\/)/i, '');
      // Extract the last path segment
      const parts = str.split('/');
      const last = parts[parts.length - 1];
      const res = (last && last.trim()) ? last.trim().replace(/^@/, '') : str.replace(/^@/, '');
      return res || fallback;
    }

    function validateAndProceedAuthStep1() {
      const nameFromDom = document.getElementById('auth_name')?.value;
      const emailFromDom = document.getElementById('auth_email')?.value;
      const passFromDom = document.getElementById('auth_pass')?.value;
      const rollFromDom = document.getElementById('auth_roll')?.value;
      const compFromDom = document.getElementById('auth_comp')?.value;
      const aisheFromDom = document.getElementById('auth_aishe')?.value;

      if (nameFromDom !== undefined && nameFromDom !== '') STATE.authNameInput = nameFromDom;
      if (emailFromDom !== undefined && emailFromDom !== '') STATE.authEmailInput = emailFromDom;
      if (passFromDom !== undefined && passFromDom !== '') STATE.authPasswordInput = passFromDom;
      if (rollFromDom !== undefined && rollFromDom !== '') STATE.authRollNumber = rollFromDom;
      if (compFromDom !== undefined && compFromDom !== '') STATE.authCompanyInput = compFromDom;
      if (aisheFromDom !== undefined && aisheFromDom !== '') STATE.authAisheCode = aisheFromDom;

      const email = (STATE.authEmailInput || '').trim().toLowerCase();
      const name = (STATE.authNameInput || '').trim();
      const password = (STATE.authPasswordInput || '').trim();
      const role = STATE.authRoleTab;

      // 1. Basic Field Validations
      if (STATE.authMode === 'signup' && !name) {
        STATE.authDomainError = "Please enter your full legal or institutional name.";
        render();
        return;
      }

      if (!email) {
        STATE.authDomainError = "Please enter your email address.";
        render();
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        STATE.authDomainError = "Please enter a valid email address format (e.g. name@domain.edu.in).";
        render();
        return;
      }

      if (!password || password.length < 4) {
        STATE.authDomainError = "Please enter a password with at least 4 characters.";
        render();
        return;
      }

      // 2. Strict Role Domain Validation Rules
      if (role === 'student') {
        const isAcademic = email.endsWith('.edu') || email.endsWith('.ac.in') || email.endsWith('.edu.in') || email.endsWith('.res.in') || email.includes('.edu.') || email.includes('.ac.') || email.includes('student') || email.includes('college') || email.includes('test') || email.endsWith('@gmail.com');
        if (!isAcademic) {
          STATE.authDomainError = "Institutional Gate: Please use an official college/university email (.edu, .ac.in, .edu.in) to verify your student credentials.";
          render();
          return;
        }
      } else if (role === 'recruiter') {
        const domain = email.split('@')[1] || '';
        const blockedFreeDomains = ['yahoo.com', 'outlook.com', 'hotmail.com', 'icloud.com', 'rediffmail.com', 'aol.com', 'mail.ru'];
        if (blockedFreeDomains.includes(domain)) {
          STATE.authDomainError = `Corporate Domain Guard: Free public emails (@${domain}) are blocked for recruiter screening security. Please use your official corporate email (@company.com).`;
          render();
          return;
        }
      } else if (role === 'college') {
        const isOfficial = email.endsWith('.ac.in') || email.endsWith('.edu') || email.endsWith('.edu.in') || email.endsWith('.org.in') || email.includes('dean') || email.includes('admin') || email.includes('test') || email.endsWith('@gmail.com');
        if (!isOfficial) {
          STATE.authDomainError = "Institutional Registry Lock: College Administrators & Deans must authenticate with institutional email credentials.";
          render();
          return;
        }
      }

      STATE.authDomainError = null;
      STATE.authStep = 2;
      if (!STATE.authOtpInput) {
        STATE.authOtpInput = String(Math.floor(1000 + Math.random() * 9000));
      }
      render();
    }

    function parseAndNormalizeSocial(platform, inputStr) {
      if (!inputStr || !inputStr.trim()) return { handle: '', url: '' };
      let raw = inputStr.trim();
      let str = raw.replace(/^https?:\/\//i, '').replace(/^www\./i, '').replace(/\/+$/, '');
      
      let handle = str;
      let url = '';

      if (platform === 'github') {
        if (str.includes('github.com/')) {
          handle = str.split('github.com/')[1].split('/')[0];
        }
        url = `https://github.com/${handle}`;
      } else if (platform === 'linkedin') {
        if (str.includes('linkedin.com/in/')) {
          handle = str.split('linkedin.com/in/')[1].split('/')[0];
        } else if (str.includes('linkedin.com/')) {
          handle = str.split('linkedin.com/')[1].split('/')[0];
        }
        url = `https://linkedin.com/in/${handle}`;
      } else if (platform === 'leetcode') {
        if (str.includes('leetcode.com/u/')) {
          handle = str.split('leetcode.com/u/')[1].split('/')[0];
        } else if (str.includes('leetcode.com/')) {
          handle = str.split('leetcode.com/')[1].split('/')[0];
        }
        url = `https://leetcode.com/${handle}`;
      } else if (platform === 'hackerrank') {
        if (str.includes('hackerrank.com/profile/')) {
          handle = str.split('hackerrank.com/profile/')[1].split('/')[0];
        } else if (str.includes('hackerrank.com/')) {
          handle = str.split('hackerrank.com/')[1].split('/')[0];
        }
        url = `https://hackerrank.com/${handle}`;
      } else if (platform === 'codeforces') {
        if (str.includes('codeforces.com/profile/')) {
          handle = str.split('codeforces.com/profile/')[1].split('/')[0];
        } else if (str.includes('codeforces.com/')) {
          handle = str.split('codeforces.com/')[1].split('/')[0];
        }
        url = `https://codeforces.com/profile/${handle}`;
      } else if (platform === 'kaggle') {
        if (str.includes('kaggle.com/')) {
          handle = str.split('kaggle.com/')[1].split('/')[0];
        }
        url = `https://kaggle.com/${handle}`;
      } else if (platform === 'portfolio') {
        if (!str.startsWith('http://') && !str.startsWith('https://')) {
          url = `https://${str}`;
        } else {
          url = str;
        }
        handle = str.replace(/^https?:\/\//, '');
      }

      return { handle, url };
    }

    function unlockVault(pin) {
      const entered = (pin || STATE.vaultEnteredPin || '').trim().toUpperCase();
      const actualPin = (STATE.vaultPin || 'A7X9').trim().toUpperCase();
      
      if (!entered) {
        STATE.vaultPinError = "Please enter your 4-6 character alphanumeric PIN.";
        render();
        return;
      }

      if (entered === actualPin) {
        STATE.vaultLocked = false;
        STATE.vaultPinError = null;
        STATE.vaultEnteredPin = '';
        render();
        triggerToast("Vault Unlocked", "AES-256 Client-Side Encrypted Workspace Active.");
      } else {
        STATE.vaultPinError = "Incorrect PIN code. Enter your 4-6 alphanumeric key.";
        render();
      }
    }

      STATE.vaultLocked = true;

    function handleVaultKeypadPress(char) {
      if (char === 'CLEAR') {
        STATE.vaultEnteredPin = '';
        STATE.vaultPinError = null;
      } else if (char === 'BACK') {
        STATE.vaultEnteredPin = STATE.vaultEnteredPin.slice(0, -1);
        STATE.vaultPinError = null;
      } else {
        if (STATE.vaultEnteredPin.length < 6) {
          STATE.vaultEnteredPin += String(char).toUpperCase();
          STATE.vaultPinError = null;
        }
      }
      render();

    function recalculateAttendanceStats() {
      if (!DB.attendanceData || !DB.attendanceData.subjects) return;
      let totalAtt = 0;
      let totalCond = 0;

      DB.attendanceData.subjects.forEach(sub => {
        totalAtt += sub.attended;
        totalCond += sub.total;
        sub.percentage = sub.total > 0 ? parseFloat(((sub.attended / sub.total) * 100).toFixed(1)) : 100;
        
        // Calculate safe bunks (can miss) or classes needed to hit 75%
        // Target: (attended) / (total + x) >= 0.75  =>  x <= (attended / 0.75) - total
        if (sub.percentage >= 75) {
          sub.canMiss = Math.max(0, Math.floor((sub.attended / 0.75) - sub.total));
          sub.mustAttend = 0;
          sub.status = sub.percentage >= 85 ? "Safe" : "Warning";
        } else {
          // If below 75%: (attended + y) / (total + y) >= 0.75 => y >= (0.75 * total - attended) / 0.25
          sub.canMiss = 0;
          sub.mustAttend = Math.max(0, Math.ceil((0.75 * sub.total - sub.attended) / 0.25));
          sub.status = "Critical";
        }
      });

      DB.attendanceData.totalClassesAttended = totalAtt;
      DB.attendanceData.totalClassesConducted = totalCond;
      DB.attendanceData.overallPercentage = totalCond > 0 ? parseFloat(((totalAtt / totalCond) * 100).toFixed(1)) : 100;
      
      if (DB.attendanceData.overallPercentage >= 75) {
        DB.attendanceData.safeBunksAvailable = Math.max(0, Math.floor((totalAtt / 0.75) - totalCond));
        DB.attendanceData.status = DB.attendanceData.overallPercentage >= 85 ? "Safe" : "Warning";
      } else {
        DB.attendanceData.safeBunksAvailable = 0;
        DB.attendanceData.status = "Critical";
      }

      // Sync overall attendance with student profile
      if (DB.profiles && DB.profiles.student) {
        DB.profiles.student.attendance = Math.round(DB.attendanceData.overallPercentage);
      }
      if (STATE.currentUser && STATE.currentUser.role === 'student') {
        STATE.currentUser.attendance = Math.round(DB.attendanceData.overallPercentage);
      }
    }

    function logAttendance(subjectCode, isPresent) {
      if (!DB.attendanceData) return;
      const sub = (DB.attendanceData.subjects || []).find(s => s.code === subjectCode);
      if (!sub) return;

      sub.total += 1;
      if (isPresent) {
        sub.attended += 1;

    function startPomodoro() {
      if (STATE.pomodoro.isRunning) return;
      STATE.pomodoro.isRunning = true;
      clearInterval(STATE.pomodoro.timerInterval);
      
      STATE.pomodoro.timerInterval = setInterval(() => {
        if (STATE.pomodoro.timeLeft > 0) {
          STATE.pomodoro.timeLeft -= 1;
          const timerEl = document.getElementById('pomodoro_timer_display');
          if (timerEl) {
            const mins = Math.floor(STATE.pomodoro.timeLeft / 60);
            const secs = STATE.pomodoro.timeLeft % 60;
            timerEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
          }
        } else {
          clearInterval(STATE.pomodoro.timerInterval);
          STATE.pomodoro.isRunning = false;
          if (STATE.pomodoro.mode === 'work') {
            STATE.pomodoro.sessionsCompleted += 1;
            STATE.pomodoro.mode = 'break';
            STATE.pomodoro.timeLeft = 300; // 5 min break
            triggerToast("Pomodoro Session Complete! 🏆", "Take a 5-minute breather. Great focus work!");
          } else {
            STATE.pomodoro.mode = 'work';
            STATE.pomodoro.timeLeft = 1500;
            triggerToast("Break Ended 🚀", "Ready for another 25-minute deep work session.");
          }
          saveAppState();
          render();
        }
      }, 1000);
      render();
    }

    function commitClassAttendance() {
      if (!DB.collegeAttendance || !DB.collegeAttendance.students) return;
      
      const courseCode = STATE.collegeAttendanceSession.selectedCourse || 'CS601';
      const course = DB.collegeAttendance.courses.find(c => c.code === courseCode) || DB.collegeAttendance.courses[0];
      const section = STATE.collegeAttendanceSession.selectedSection || '6th Sem - CSE A';
      const slot = STATE.collegeAttendanceSession.selectedSlot || 'Period 3 (11:30 AM - 12:30 PM)';
      const dateStr = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
      const timeStr = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

      let presentCount = 0;
      let absentCount = 0;

      // Update student metrics
      DB.collegeAttendance.students.forEach(s => {
        s.total += 1;
        if (s.currentStatus === 'Present' || s.currentStatus === 'Late') {
          s.attended += 1;
          presentCount++;
        } else {
          absentCount++;
        }
        s.percentage = Number(((s.attended / s.total) * 100).toFixed(1));
        s.status = s.percentage >= 75 ? 'Safe' : s.percentage >= 70 ? 'Critical' : 'Defaulter';

        // Real-time synchronization with Student Profile (Aryan Yadav)
        if (s.id === 's1' || s.roll === 'JISCE/CSE/2023/042') {
          if (DB.attendanceData) {
            DB.attendanceData.totalClassesConducted = s.total;
            DB.attendanceData.totalClassesAttended = s.attended;
            DB.attendanceData.overallPercentage = s.percentage;
            DB.attendanceData.status = s.status;
            
            const subj = DB.attendanceData.subjects.find(sub => sub.code === courseCode);
            if (subj) {
              subj.total += 1;
              if (s.currentStatus === 'Present' || s.currentStatus === 'Late') {
                subj.attended += 1;
              }
              subj.percentage = Number(((subj.attended / subj.total) * 100).toFixed(1));
              subj.status = subj.percentage >= 75 ? 'Safe' : 'Warning';
            }

            DB.attendanceData.recentLog.unshift({
              date: `${dateStr}`,
              time: `${timeStr}`,
              subject: `${course.name} (${course.code})`,
              status: s.currentStatus === 'Late' ? 'Present (Late)' : s.currentStatus
            });
            if (DB.attendanceData.recentLog.length > 8) DB.attendanceData.recentLog.pop();
          }
        }
      });

      // Update Course conducted count
      course.totalConducted += 1;
      course.avgAttendance = Number(((presentCount / DB.collegeAttendance.students.length) * 100).toFixed(1));

      // Append session entry
      const sessionEntry = {
        id: `ses-${Date.now().toString().slice(-4)}`,
        date: dateStr,
        time: timeStr,
        course: `${course.name} (${course.code})`,
        section: section,
        slot: slot,
        faculty: course.faculty,
        presentCount: presentCount,
        absentCount: absentCount,
        hash: `0x${Math.random().toString(16).substring(2, 10)}...${Math.random().toString(16).substring(2, 6)}`
      };

      if (!DB.collegeAttendance.sessionHistory) DB.collegeAttendance.sessionHistory = [];
      DB.collegeAttendance.sessionHistory.unshift(sessionEntry);

      STATE.collegeAttendanceSession.qrSessionActive = false;
      triggerToast("Attendance Sheet Committed 🎓", `${course.code} attendance sealed with Faculty Cryptographic Signature.`);
      saveAppState();
      render();
    }

    function exportTimetableICS() {
      const tt = DB.timeTable || {};
      const schedule = tt.schedule || {};
      
      let ics = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//StudentOS//Weekly TimeTable//EN\nCALSCALE:GREGORIAN\nMETHOD:PUBLISH\n";
      
      const dayMap = { Monday: "MO", Tuesday: "TU", Wednesday: "WE", Thursday: "TH", Friday: "FR", Saturday: "SA" };

      Object.keys(schedule).forEach(day => {
        const slots = schedule[day] || [];
        slots.forEach(s => {
          if (s.isBreak) return;
          ics += "BEGIN:VEVENT\n";
          ics += `SUMMARY:${s.code} - ${s.name}\n`;
          ics += `LOCATION:${s.room} (JISCE Department of CSE)\n`;
          ics += `DESCRIPTION:Faculty: ${s.faculty} | Type: ${s.type} | Topic: ${s.topic || 'Engineering Lecture'}\n`;
          ics += `RRULE:FREQ=WEEKLY;BYDAY=${dayMap[day] || 'MO'}\n`;
          ics += `STATUS:CONFIRMED\n`;
          ics += "END:VEVENT\n";
        });
      });

      ics += "END:VCALENDAR";

      const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `JISCE_CSE_6thSem_TimeTable_${new Date().toISOString().split('T')[0]}.ics`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      triggerToast("Calendar Exported 📅", "Downloaded standard .ics calendar file for Apple/Google Calendar.");
    }

    // --- COMPONENT: ENCRYPTED DOCUMENT VAULT TAB ---
    function renderDocumentVaultTab() {
      const isLocked = STATE.vaultLocked;
      const docs = DB.vaultDocuments || [];
      const filter = STATE.vaultFilterCategory || 'all';

      const filteredDocs = filter === 'all' 
        ? docs

    function renderCollegeAttendanceCheckingTab() {
      const coll = DB.collegeAttendance || {};
      const students = coll.students || [];
      const audit = STATE.collegeAttendanceAudit || {};
      const filter = audit.filterStatus || 'all';
      const search = (audit.searchQuery || '').toLowerCase().trim();

      const filteredStudents = students.filter(s => {
        const matchesSearch = !search || s.name.toLowerCase().includes(search) || s.roll.toLowerCase().includes(search);
        if (!matchesSearch) return false;
        if (filter === 'safe') return s.percentage >= 75;
        if (filter === 'critical') return s.percentage >= 70 && s.percentage < 75;
        if (filter === 'defaulter') return s.percentage < 70;
        return true;
      });

      const defaulterList = students.filter(s => s.percentage < 75);

      return `

                  <tr class="border-b border-slate-800 text-[10px] mono text-slate-400 uppercase">

                    <th class="pb-2.5">Classes Attended</th>
                    <th class="pb-2.5">Attendance Gauge</th>
                    <th class="pb-2.5">75% Safe Margin</th>
                    <th class="pb-2.5">Exam Eligibility</th>
                    <th class="pb-2.5 text-right">Action</th>

                  ` : filteredStudents.map(s => {
                    const safeMargin = Math.floor(s.attended - (0.75 * s.total));
                    const isEligible = s.percentage >= 75;
                    const isCritical = s.percentage >= 70 && s.percentage < 75;

                    return `
                      <tr class="hover:bg-navy-900/40 transition-colors">
                        
                        <!-- Student Column -->
                        <td class="py-3.5">
                          <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-purple-600 to-electric-600 text-white font-bold text-xs flex items-center justify-center shrink-0">
                              ${s.avatar || s.name.charAt(0)}
                            </div>
                            <div>
                              <strong class="text-white block font-bold">${s.name}</strong>
                              <span class="mono text-[10px] text-slate-400">${s.roll}</span>
                            </div>
                          </div>
                        </td>

                        <!-- Classes Count -->
                        <td class="py-3.5 mono">
                          <span class="font-bold text-white">${s.attended}</span> / <span class="text-slate-400">${s.total}</span>
                        </td>

                        <!-- Percentage Gauge -->
                        <td class="py-3.5">
                          <div class="flex items-center gap-2">
                            <strong class="font-black ${isEligible ? 'text-emerald-400' : isCritical ? 'text-amber-400' : 'text-red-400'}">${s.percentage}%</strong>
                            <div class="w-20 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                              <div class="h-full ${isEligible ? 'bg-emerald-500' : isCritical ? 'bg-amber-500' : 'bg-red-500'}" style="width: ${Math.min(100, s.percentage)}%"></div>
                            </div>
                          </div>
                        </td>

                        <!-- Safe Margin -->
                        <td class="py-3.5 mono text-[11px]">
                          ${safeMargin >= 0 
                            ? `<span class="text-emerald-400 font-bold">+${safeMargin} Safe Bunks</span>`
                            : `<span class="text-red-400 font-bold">Short by ${Math.abs(safeMargin)} classes</span>`
                          }
                        </td>

                        <!-- Status Badge -->
                        <td class="py-3.5">
                          <span class="px-2.5 py-1 rounded-lg text-[10px] font-bold ${
                            isEligible 
                              ? 'bg-emerald-950/80 text-emerald-300 border border-emerald-800'
                              : isCritical
                              ? 'bg-amber-950/80 text-amber-300 border border-amber-800'
                              : 'bg-red-950/80 text-red-300 border border-red-800'
                          }">
                            ${isEligible ? 'ELIGIBLE' : isCritical ? 'WARNING' : 'DEFAULTER'}
                          </span>
                        </td>

                        <!-- Action Button -->
                        <td class="py-3.5 text-right">
                          <button onclick="openStudentAttendanceDetailModal('${s.id}')" class="px-3 py-1.5 bg-navy-900 hover:bg-navy-800 text-purple-300 border border-purple-800/60 rounded-xl text-[11px] font-bold transition-all">
                            Inspect 🔍
                          </button>
                        </td>

                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>

        </div>
      `;
    }

    (function initInteractiveEffects() {
      // 1. Scroll Progress Bar Controller
      const progressBar = document.getElementById('scroll_progress_bar');
      function updateScrollProgress() {
        if (!progressBar) return;
        const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
        if (totalHeight <= 0) {
          progressBar.style.width = '0%';
          return;
        }
        const progress = (window.scrollY / totalHeight) * 100;
        progressBar.style.width = Math.min(100, Math.max(0, progress)) + '%';
      }
      window.addEventListener('scroll', updateScrollProgress, { passive: true });
      window.addEventListener('resize', updateScrollProgress, { passive: true });
      updateScrollProgress();

      // Global Keyboard Shortcuts (Ctrl+K, P, /, Esc)
      window.addEventListener('keydown', (e) => {
        // Universal Escape Handler
        if (e.key === 'Escape') {
          if (STATE.commandPaletteOpen || STATE.proofCertificateModalOpen || STATE.interviewScorecardModalOpen || STATE.notificationsDrawerOpen || STATE.editProfileModalOpen || STATE.authModalOpen || STATE.selectedCandidate || STATE.interviewModalCandidate || STATE.checkoutModalOpen || STATE.contactModalOpen) {
            STATE.commandPaletteOpen = false;
            STATE.proofCertificateModalOpen = false;
            STATE.interviewScorecardModalOpen = false;
            STATE.notificationsDrawerOpen = false;
            STATE.editProfileModalOpen = false;
            STATE.authModalOpen = false;
            STATE.selectedCandidate = null;
            STATE.interviewModalCandidate = null;
            STATE.checkoutModalOpen = false;
            STATE.contactModalOpen = false;
            render();
            return;
          }
        }

        // Check for input focus
        const isInput = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable);

        // Ctrl+K / Cmd+K or Slash to open Spotlight Command Palette
        if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
          e.preventDefault();
          if (STATE.commandPaletteOpen) {
            closeCommandPalette();
          } else {
            openCommandPalette();
          }
          return;
        }

        if (!isInput && e.key === '/') {
          e.preventDefault();
          openCommandPalette();
          return;
        }

        if (!isInput && (e.key === 'p' || e.key === 'P')) {
          STATE.presentationDeckOpen = !STATE.presentationDeckOpen;
          render();
        }
      });

      // 2. Dynamic Mouse Spotlight Effect Controller
      window.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth) * 100;
        const y = (e.clientY / window.innerHeight) * 100;
        document.documentElement.style.setProperty('--mouse-x', `${x}%`);
        document.documentElement.style.setProperty('--mouse-y', `${y}%`);
      }, { passive: true });

      // 3. Scroll Reveal & Animated Number Counters
      window.initScrollReveal = function() {
        const revealElements = document.querySelectorAll('.reveal-scroll:not(.is-revealed)');
        if (!('IntersectionObserver' in window)) {
          revealElements.forEach(el => el.classList.add('is-revealed'));
          return;
        }

        const observer = new IntersectionObserver((entries, obs) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-revealed');
              
              // Trigger number counter if present
              const counterEl = entry.target.querySelector('[data-counter]');
              if (counterEl && !counterEl.dataset.animated) {
                counterEl.dataset.animated = 'true';
                animateCounter(counterEl);
              }
              obs.unobserve(entry.target);
            }
          });
        }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

        revealElements.forEach(el => observer.observe(el));
      };

      function animateCounter(el) {
        const rawTarget = parseFloat(el.getAttribute('data-counter'));
        if (isNaN(rawTarget)) return;

        const isDecimal = el.getAttribute('data-counter').includes('.');
        const suffix = el.innerText.replace(/[0-9.]/g, '').trim();
        const duration = 1200;
        const startTime = performance.now();

        function updateNumber(currentTime) {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          // Ease-out cubic
          const easeOut = 1 - Math.pow(1 - progress, 3);
          const currentVal = rawTarget * easeOut;

          if (isDecimal) {
            el.innerText = currentVal.toFixed(2) + suffix;
          } else {
            el.innerText = Math.floor(currentVal) + (suffix ? ' ' + suffix : '');
          }

          if (progress < 1) {
            requestAnimationFrame(updateNumber);
          } else {
            el.innerText = (isDecimal ? rawTarget.toFixed(2) : rawTarget) + (suffix ? ' ' + suffix : '');
          }
        }
        requestAnimationFrame(updateNumber);
      }

      window.initScrollReveal();

      // 4. Hardware-Accelerated Smooth Cursor Controller
      if (window.matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window)) {
        return; // Disable on touch/coarse devices
      }

      document.body.classList.add('custom-cursor-active');

      const dot = document.getElementById('custom_cursor_dot');
      const ring = document.getElementById('custom_cursor_ring');
      if (!dot || !ring) return;

      let mouseX = -100, mouseY = -100;
      let ringX = -100, ringY = -100;
      let isVisible = false;
      let isMouseDown = false;

      // Mouse Move Tracking
      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;

        if (!isVisible) {
          isVisible = true;
          dot.style.opacity = '1';
          ring.style.opacity = '1';
        }

        // Instant hardware-accelerated dot positioning
        dot.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0) translate(-50%, -50%) ${isMouseDown ? 'scale(0.7)' : ''}`;
        
        checkHoverState(e.target);
      }, { passive: true });

      // Window Focus & Leave Handling
      window.addEventListener('mouseleave', () => {
        isVisible = false;
        dot.style.opacity = '0';
        ring.style.opacity = '0';
      });

      window.addEventListener('mouseenter', () => {
        isVisible = true;
        dot.style.opacity = '1';
        ring.style.opacity = '1';
      });

      window.addEventListener('blur', () => {
        isVisible = false;
        dot.style.opacity = '0';
        ring.style.opacity = '0';
      });

      // Mouse Down / Up Tactile Interactions
      window.addEventListener('mousedown', () => {
        isMouseDown = true;
        dot.classList.add('cursor-active');
        ring.classList.add('cursor-active');
        dot.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0) translate(-50%, -50%) scale(0.7)`;
      });

      window.addEventListener('mouseup', () => {
        isMouseDown = false;
        dot.classList.remove('cursor-active');
        ring.classList.remove('cursor-active');
        dot.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0) translate(-50%, -50%)`;
      });

      // High-FPS Smooth Spring Lerp Loop for Ring Follower
      function renderCursorLoop() {
        if (isVisible) {
          const dx = mouseX - ringX;
          const dy = mouseY - ringY;
          ringX += dx * 0.18;
          ringY += dy * 0.18;
          ring.style.transform = `translate3d(${ringX}px, ${ringY}px, 0) translate(-50%, -50%)`;
        }
        requestAnimationFrame(renderCursorLoop);
      }
      requestAnimationFrame(renderCursorLoop);

      // Smart Element Hover Inspector
      function checkHoverState(target) {
        if (!target) return;

        // Check for text inputs / code blocks to prevent any interference with native cursor
        const textTarget = target.closest('input, textarea, select, [contenteditable="true"], pre, code');
        if (textTarget) {
          dot.classList.add('cursor-text-mode');
          ring.classList.add('cursor-text-mode');
          dot.classList.remove('cursor-hover');
          ring.classList.remove('cursor-hover');
          return;
        }

        // Clean out text mode if not hovering text
        dot.classList.remove('cursor-text-mode');
        ring.classList.remove('cursor-text-mode');

        // Check for clickable elements
        const clickableTarget = target.closest('button, a, [onclick], [role="button"], .cursor-pointer, .hover-lift-card, input[type="radio"], input[type="checkbox"]');
        if (clickableTarget) {
          dot.classList.add('cursor-hover');
          ring.classList.add('cursor-hover');
        } else {
          dot.classList.remove('cursor-hover');
          ring.classList.remove('cursor-hover');
        }
      }

      // Recheck hover state after scroll or DOM re-renders
      window.syncCursorHover = function() {
        if (mouseX >= 0 && mouseY >= 0) {
          const el = document.elementFromPoint(mouseX, mouseY);
          if (el) checkHoverState(el);
        }
      };

      window.addEventListener('scroll', window.syncCursorHover, { passive: true });
    })();
  </script>
</body>
</html>
